<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de recorridos</title>
<meta name="theme-color" content="#0d0f14">
<style>
:root{--bg:#f2f3f7;--card:#fff;--tx:#12141a;--mu:#656d7c;--bd:#e0e3ea;--ac:#d62839;--ac2:#fde9eb;--bl:#1f5fbf;--bl2:#e6eefb;--bk:#0d0f14;--rd:#c4182a;--or:#b54708;--sh:0 2px 10px rgba(13,15,20,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c10;--card:#151922;--tx:#eef0f5;--mu:#9aa3b2;--bd:#2a303c;--ac:#ff4d5e;--ac2:#3a1a20;--bl:#5b9dff;--bl2:#15233d;--bk:#05060a;--rd:#ff7b88;--or:#fdb022;--sh:0 2px 12px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0a0c10;--card:#151922;--tx:#eef0f5;--mu:#9aa3b2;--bd:#2a303c;--ac:#ff4d5e;--ac2:#3a1a20;--bl:#5b9dff;--bl2:#15233d;--bk:#05060a;--rd:#ff7b88;--or:#fdb022;--sh:0 2px 12px rgba(0,0,0,.5)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 12px 40px}
main{max-width:640px;margin:0 auto}
header{background:var(--bk);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;border-bottom:4px solid var(--ac);box-shadow:var(--sh);position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--ac) 0 50%,var(--bl) 50% 100%)}
h1{font-size:20px;margin:0}header small{color:#aab3c2;font-size:13px}
nav{display:flex;gap:8px;margin-bottom:12px}
nav button{flex:1;padding:11px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;font-weight:700;font-size:14px;box-shadow:var(--sh)}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:12px 0 5px}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font-size:16px;outline:0}
input:focus,select:focus{border-color:var(--bl)}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;color:var(--tx)}.chk input{width:22px;height:22px;accent-color:var(--ac);border-radius:6px}
.prev{background:var(--bl2);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px;border-left:5px solid var(--bl)}
.prev b{font-size:15px}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;margin-top:14px;box-shadow:var(--sh)}
.btn.s{background:var(--card);color:var(--bl);border:1.5px solid var(--bl);margin-top:8px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk button{width:46px;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--bl);color:#fff;font-size:20px}
.wk div{text-align:center;font-weight:700}.wk small{display:block;color:var(--mu);font-weight:400}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tot div{border-radius:16px;padding:12px}
.tot .t{background:var(--bl2);border-left:5px solid var(--bl)}.tot .m{background:var(--ac2);border-left:5px solid var(--ac)}
.tot .g{grid-column:1/-1;background:var(--bk);color:#fff}.tot .g span{color:#aab3c2}
.tot span{font-size:12px;color:var(--mu);display:block}.tot b{font-size:18px}
.mbox{display:flex;align-items:center;gap:10px}
.moto{width:84px;height:58px;object-fit:cover;border-radius:12px;border:2px solid var(--ac);flex:none;box-shadow:var(--sh)}
.moto.s{width:44px;height:32px;border-radius:9px;border-width:1.5px;vertical-align:middle;margin-right:6px}
.mv{display:flex;align-items:center;gap:10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border-bottom:0}.row small{color:var(--mu);display:block}
.row .r{text-align:right;white-space:nowrap}
.tag{color:#fff;background:var(--ac);border-radius:8px;padding:1px 7px;font-weight:700;font-size:11px}
.del{background:none;border:0;color:var(--rd);font-size:13px;padding:4px 0}
h2{font-size:15px;margin:0 0 6px}.empty{color:var(--mu);font-size:14px;padding:8px 0}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 9px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}
th{color:var(--bl);font-weight:700}td:nth-child(4){color:var(--ac)}
</style></head><body><main>

const IM='<img class="moto s" src="'+MOTO+'" alt="Yamaha XTZ 150">';
const K="recorridos_v1";let S={trips:[]},tab="reg",off=0,msg="";
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=n=>"$ "+Math.round(n).toLocaleString("es-CO");
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const mon=s=>{const d=pd(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ds(d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const fmt=s=>pd(s).toLocaleDateString("es-CO",{day:"numeric",month:"short"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pay(t){const r=T[t.loc];return t.f?{t:r[5]/2,m:r[5]/2}:{t:r[2],m:r[3]}}
const weekOf=w=>S.trips.filter(t=>mon(t.d)===w).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.id-b.id);
const curW=()=>addD(mon(ds(new Date())),off*7);
function sums(list){const o={t:0,m:0,by:{},bm:{}};list.forEach(x=>{const p=pay(x);o.t+=p.t;o.m+=p.m;
const a=o.by[x.tn]=o.by[x.tn]||{n:0,v:0};a.n++;a.v+=p.t;const b=o.bm[x.mn]=o.bm[x.mn]||{n:0,v:0};b.n++;b.v+=p.m});return o}
function render(){
nav.innerHTML=[["reg","Registrar"],["sem","Semana"],["tar","Tarifas"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("");
v.innerHTML={reg:vReg,sem:vSem,tar:vTar}[tab]();
if(tab==="reg")prevUp();
}
function vReg(){
const tn=[...new Set(S.trips.map(t=>t.tn))],mn=[...new Set(S.trips.map(t=>t.mn))];
return `<div class="card"><label>Fecha</label><input type="date" id="d" value="${ds(new Date())}">
<label>Localidad</label><select id="l" onchange="prevUp()">${T.map((r,i)=>`<option value="${i}">${esc(r[0])} (${esc(r[1])}${r[1]==="Banderazo"?"":" km"})</option>`).join("")}</select>
<label>Técnico</label><input id="tn" list="ltn" placeholder="Nombre del técnico" autocomplete="off"><datalist id="ltn">${tn.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
<label>Móvil (Yamaha XTZ 150)</label><div class="mv"><img class="moto" src="${MOTO}" alt="Yamaha XTZ 150"><input id="mn" list="lmn" placeholder="Nombre o placa del móvil" autocomplete="off"></div><datalist id="lmn">${mn.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
<label class="chk"><input type="checkbox" id="f" onchange="prevUp()"> Viaje fallido</label>
<div class="prev" id="pv"></div>
<button class="btn" onclick="add()">Guardar viaje</button>
<div id="ms" style="color:var(--ac);font-size:14px;margin-top:8px">${esc(msg)}</div></div>`}
function prevUp(){const l=document.getElementById("l");if(!l)return;const f=document.getElementById("f").checked;
const p=pay({loc:+l.value,f});document.getElementById("pv").innerHTML=`Técnico: <b>${$(p.t)}</b><br>Móvil: <b>${$(p.m)}</b><br>Total: <b>${$(p.t+p.m)}</b>${f?' <span class="tag">FALLIDO (mitad y mitad)</span>':""}`}
function add(){const tn=document.getElementById("tn").value.trim(),mn=document.getElementById("mn").value.trim(),d=document.getElementById("d").value;
if(!d||!tn||!mn){msg="Completa fecha, técnico y móvil.";render();return}
S.trips.push({id:Date.now(),d,loc:+document.getElementById("l").value,tn,mn,f:document.getElementById("f").checked});save();
msg="Viaje guardado ✓";off=0;render();setTimeout(()=>{msg="";const m=document.getElementById("ms");if(m)m.textContent=""},2500)}
function del(id){if(!confirm("¿Eliminar este viaje?"))return;S.trips=S.trips.filter(t=>t.id!==id);save();render()}
function vSem(){const w=curW(),L=weekOf(w),s=sums(L);
const grp=(o,t)=>Object.keys(o).length?`<div class="card"><h2>${t}</h2>${Object.entries(o).sort().map(([k,a])=>`<div class="row"><div>${esc(k)}<small>${a.n} viaje${a.n>1?"s":""}</small></div><div class="r"><b>${$(a.v)}</b></div></div>`).join("")}</div>`:"";
return `<div class="card wk"><button onclick="off--;render()">‹</button><div>${fmt(w)} – ${fmt(addD(w,6))}<small>Lunes a domingo · ${L.length} viaje${L.length===1?"":"s"}</small></div><button onclick="off++;render()">›</button></div>
<div class="card tot"><div class="t"><span>Total técnico</span><b>${$(s.t)}</b></div><div class="m"><div class="mbox"><img class="moto s" src="${MOTO}" alt="Yamaha XTZ 150" style="margin:0"><div style="padding:0;background:none;border:0"><span>Total móvil</span><b>${$(s.m)}</b></div></div></div><div class="g"><span>Total semana</span><b>${$(s.t+s.m)}</b></div></div>
${grp(s.by,"Por técnico")}${grp(s.bm,IM+"Por móvil")}
<div class="card"><h2>Viajes de la semana</h2>${L.length?L.map(t=>{const p=pay(t);return `<div class="row"><div>${fmt(t.d)} · ${esc(T[t.loc][0])} ${t.f?'<span class="tag">FALLIDO</span>':""}<small>Téc: ${esc(t.tn)} · Móvil: ${esc(t.mn)}</small><button class="del" onclick="del(${t.id})">Eliminar</button></div><div class="r">${$(p.t)}<small>${$(p.m)}</small></div></div>`}).join(""):'<div class="empty">Sin viajes esta semana.</div>'}</div>
<button class="btn" onclick="exp(false)">Exportar semana a Excel (CSV)</button><button class="btn s" onclick="exp(true)">Exportar todo a Excel (CSV)</button>`}
function vTar(){return `<div class="card sc"><table><tr><th>Localidad</th><th>Km</th><th>Técnico</th><th>Móvil</th><th>Total</th><th>Fallido</th></tr>${T.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${$(r[2])}</td><td>${$(r[3])}</td><td>${$(r[4])}</td><td>${$(r[5])}</td></tr>`).join("")}</table></div>
<div class="empty">Fallido: se reparte mitad técnico y mitad móvil.</div>`}
async function exp(all){
const L=(all?[...S.trips].sort((a,b)=>a.d<b.d?-1:1):weekOf(curW()));
if(!L.length){alert("No hay viajes para exportar.");return}
const q=x=>'"'+String(x).replace(/"/g,'""')+'"';
let c="Semana (lunes);Fecha;Localidad;Técnico;Móvil;Fallido;Pago técnico;Pago móvil;Total\n";
